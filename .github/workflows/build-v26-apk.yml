name: Build RoboKids V26 Android FULL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android base
        run: |
          test -f RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -t RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -o RoboKids_V20_Android_FULL_SOURCE_OK.zip

      - name: Reconstruct Android sources
        run: |
          base64 -d v23/server.java.gz.b64 | gunzip > app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java
          base64 -d v23/main.java.gz.b64 | gunzip > app/src/main/java/com/robokidslab/nivel1/MainActivity.java
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('app/src/main/assets/missions.json')
          missions=json.loads(base.read_text(encoding='utf-8'))
          spider=json.loads(Path('v23/spider_missions.json').read_text(encoding='utf-8'))
          missions=[m for m in missions if int(m.get('id',0)) < 21] + spider
          base.write_text(json.dumps(missions,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Missions:', len(missions))
          PY
          rm -f app/src/main/res/drawable/ic_launcher.xml
          base64 -d v23/logo.jpg.b64 > app/src/main/res/drawable/ic_launcher.jpg
          python3 v23/web_patch.py
          python3 v24/web_patch.py
          python3 v26/web_patch.py
          python3 v26/server_patch.py

      - name: Set V26 Android package metadata
        run: |
          sed -i "s/applicationId 'com.robokidslab.nivel1'/applicationId 'com.robokidslab.v26'/" app/build.gradle
          sed -i "s/versionCode 200/versionCode 260/" app/build.gradle
          sed -i "s/versionName '20.0-full'/versionName '26.0-full'/" app/build.gradle
          printf '%s\n' '<resources>' '    <string name="app_name">RoboKids LAB V26</string>' '</resources>' > app/src/main/res/values/strings.xml
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle
          grep -n "V26-ANDROID-FULL\|correctCount\|physicalPassed" app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java | head -30
          grep -n "Biblioteca docente\|Puntaje V26" app/src/main/assets/public/index.html | head -20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoboKids_LAB_V26.apk

      - name: Upload V26 APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboKids-LAB-V26-APK
          path: RoboKids_LAB_V26.apk
          retention-days: 30
