name: Build RoboKids V26 Android FULL APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android base
        run: |
          test -f RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -t RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -o RoboKids_V20_Android_FULL_SOURCE_OK.zip

      - name: Reconstruct V23 Android sources
        run: |
          base64 -d v23/server.java.gz.b64 | gunzip > app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java
          base64 -d v23/main.java.gz.b64 | gunzip > app/src/main/java/com/robokidslab/nivel1/MainActivity.java
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('app/src/main/assets/missions.json')
          missions=json.loads(base.read_text(encoding='utf-8'))
          spider=json.loads(Path('v23/spider_missions.json').read_text(encoding='utf-8'))
          missions=[m for m in missions if int(m.get('id',0)) < 21] + spider
          base.write_text(json.dumps(missions,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Missions:', len(missions))
          PY
          rm -f app/src/main/res/drawable/ic_launcher.xml
          base64 -d v23/logo.jpg.b64 > app/src/main/res/drawable/ic_launcher.jpg
          python3 v23/web_patch.py
          python3 v24/web_patch.py
          python3 v26/web_patch.py

      - name: Apply V26 server and package changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V23-ANDROID-FULL','V26-ANDROID-FULL')
          s=s.replace('robokids_rooms_v23_android.json','robokids_rooms_v26_android.json')

          # Physical result exposed to the V24/V26 professor dashboard.
          old='x.addProperty("connected", connected); x.addProperty("total", total); x.addProperty("answered", answered);'
          if 'physicalPassed' not in s and old in s:
              new='x.addProperty("connected", connected); x.addProperty("total", total); x.addProperty("answered", answered); Map<String,Integer> pa=room.physicalAwards.get(mk); x.addProperty("physicalPassed", pa!=null && pa.getOrDefault(t.id,0)>0);'
              s=s.replace(old,new,1)

          # V26: individual participant scoring (+100 for each correct answer).
          start=s.find('    private JsonObject aggregateResponses(Room room) {')
          end=s.find('    private void recomputeScores(Room room) {', start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontraron métodos de puntuación')
          scoring=r'''    private JsonObject aggregateResponses(Room room) {
        Mission m = getMission(room);
        Map<String, Map<String, Answer>> mr = room.responses.get(missionKey(room));
        JsonObject out = new JsonObject();
        for (Team t : TEAMS) {
            Map<String, Integer> counts = new LinkedHashMap<>();
            int total = 0;
            int correctCount = 0;
            if (mr != null && mr.get(t.id) != null) {
                for (Answer a : mr.get(t.id).values()) {
                    counts.put(a.value, counts.getOrDefault(a.value, 0) + 1);
                    total++;
                    if (m.question.correct.equals(a.value)) correctCount++;
                }
            }
            String majority = null;
            int best = -1;
            boolean tie = false;
            for (Map.Entry<String,Integer> e : counts.entrySet()) {
                if (e.getValue() > best) {
                    best = e.getValue();
                    majority = e.getKey();
                    tie = false;
                } else if (e.getValue() == best) {
                    tie = true;
                }
            }
            if (tie) majority = null;
            int incorrectCount = Math.max(0, total - correctCount);
            JsonObject x = new JsonObject();
            x.add("counts", gson.toJsonTree(counts));
            x.addProperty("total", total);
            if (majority != null) x.addProperty("majority", majority); else x.add("majority", null);
            x.addProperty("correctCount", correctCount);
            x.addProperty("incorrectCount", incorrectCount);
            x.addProperty("points", room.revealed ? correctCount * 100 : 0);
            if (room.revealed && total > 0) x.addProperty("correct", correctCount == total); else x.add("correct", null);
            out.add(t.id, x);
        }
        return out;
    }

    private void scoreQuestion(Room room) {
        JsonObject agg = aggregateResponses(room);
        Map<String,Integer> award = new LinkedHashMap<>();
        for (Team t : TEAMS) {
            JsonObject r = agg.getAsJsonObject(t.id);
            int correctCount = r.has("correctCount") ? r.get("correctCount").getAsInt() : 0;
            award.put(t.id, correctCount * 100);
        }
        room.digitalAwards.put(missionKey(room), award);
        recomputeScores(room);
    }

'''
          s=s[:start]+scoring+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

          sed -i "s/applicationId 'com.robokidslab.nivel1'/applicationId 'com.robokidslab.v26'/" app/build.gradle
          sed -i "s/versionCode 200/versionCode 260/" app/build.gradle
          sed -i "s/versionName '20.0-full'/versionName '26.0-full'/" app/build.gradle
          printf '%s\n' '<resources>' '    <string name="app_name">RoboKids LAB V26</string>' '</resources>' > app/src/main/res/values/strings.xml

          grep -n "applicationId\|versionCode\|versionName" app/build.gradle
          grep -n "V26-ANDROID-FULL\|correctCount\|physicalPassed" app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java | head -30
          grep -n "Biblioteca docente\|Puntaje V26" app/src/main/assets/public/index.html | head -20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoboKids_LAB_V26.apk

      - name: Upload V26 APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboKids-LAB-V26-APK
          path: RoboKids_LAB_V26.apk
          retention-days: 30
