name: Build RoboKids V23 Android FULL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V20 Android base
        run: |
          test -f RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -t RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -o RoboKids_V20_Android_FULL_SOURCE_OK.zip
      - name: Apply V23 Android FULL patch
        run: |
          base64 -d .payload_v23/patch_v23_android.py.gz.b64 | gunzip > /tmp/patch_v23_android.py
          python3 /tmp/patch_v23_android.py
          grep -n "V23-ANDROID-FULL" app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java
          grep -n "versionName '23.0-full'" app/build.gradle
          test -f app/src/main/res/drawable/ic_launcher.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build V23 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoboKids_LAB_V23_Android_FULL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoboKids-LAB-V23-Android-FULL-APK
          path: RoboKids_LAB_V23_Android_FULL.apk
          retention-days: 30
