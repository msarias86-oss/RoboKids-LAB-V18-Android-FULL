name: Build RoboKids V24 Android FULL APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android base
        run: |
          test -f RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -t RoboKids_V20_Android_FULL_SOURCE_OK.zip
          unzip -o RoboKids_V20_Android_FULL_SOURCE_OK.zip

      - name: Reconstruct V23 Android sources
        run: |
          base64 -d v23/server.java.gz.b64 | gunzip > app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java
          base64 -d v23/main.java.gz.b64 | gunzip > app/src/main/java/com/robokidslab/nivel1/MainActivity.java
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('app/src/main/assets/missions.json')
          missions=json.loads(base.read_text(encoding='utf-8'))
          spider=json.loads(Path('v23/spider_missions.json').read_text(encoding='utf-8'))
          missions=[m for m in missions if int(m.get('id',0)) < 21] + spider
          base.write_text(json.dumps(missions,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Missions:', len(missions))
          PY
          rm -f app/src/main/res/drawable/ic_launcher.xml
          base64 -d v23/logo.jpg.b64 > app/src/main/res/drawable/ic_launcher.jpg
          python3 v23/web_patch.py

      - name: Apply V24 fixes
        run: |
          python3 v24/web_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V23-ANDROID-FULL','V24-ANDROID-FULL')
          s=s.replace('robokids_rooms_v23_android.json','robokids_rooms_v24_android.json')
          old='x.addProperty("connected", connected); x.addProperty("total", total); x.addProperty("answered", answered);'
          new='x.addProperty("connected", connected); x.addProperty("total", total); x.addProperty("answered", answered); Map<String,Integer> pa=room.physicalAwards.get(mk); x.addProperty("physicalPassed", pa!=null && pa.getOrDefault(t.id,0)>0);'
          if old not in s:
              raise SystemExit('No se encontró teamSummary para physicalPassed')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          sed -i "s/applicationId 'com.robokidslab.nivel1'/applicationId 'com.robokidslab.v24'/" app/build.gradle
          sed -i "s/versionCode 200/versionCode 240/" app/build.gradle
          sed -i "s/versionName '20.0-full'/versionName '24.0-full'/" app/build.gradle
          printf '%s\n' '<resources>' '    <string name="app_name">RoboKids LAB V24</string>' '</resources>' > app/src/main/res/values/strings.xml
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle
          grep -n "V24-ANDROID-FULL\|physicalPassed" app/src/main/java/com/robokidslab/nivel1/EmbeddedRoboKidsServer.java
          grep -n "V24 · Panel Profesor optimizado" app/src/main/assets/public/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoboKids_LAB_V24.apk

      - name: Upload V24 APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboKids-LAB-V24-APK
          path: RoboKids_LAB_V24.apk
          retention-days: 30
