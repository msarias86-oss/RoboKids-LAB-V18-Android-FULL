name: Build RoboKids V20 Android FULL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -o RoboKids_V20_Android_FULL_SOURCE.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoboKids_LAB_V20_Android_FULL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoboKids-LAB-V20-Android-FULL-APK
          path: RoboKids_LAB_V20_Android_FULL.apk
          retention-days: 30
